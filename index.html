<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Les couleurs de la famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7;--card:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--faint:#86868B;--line:#D2D2D7;--hair:rgba(0,0,0,.08);--fill:#E8E8ED;
  --j:#F2B10C;--v:#28A065;--r:#E5463B;--b:#2F6FD6;
  --j-soft:#FFF4D6;--v-soft:#DDF3E6;--r-soft:#FDE3E0;--b-soft:#E1EBFB;
  --c:var(--ink);--soft:var(--fill);
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100vh}
html[lang="ar"] body{font-family:"SF Arabic","IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif;letter-spacing:0;line-height:1.75}
h1,h2,h3,h4{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.1}
html[lang="ar"] :is(h1,h2,h3,h4,.choice strong,.step i){font-family:"SF Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;letter-spacing:0;line-height:1.4}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;letter-spacing:inherit}
:focus-visible{outline:3px solid #0071E3;outline-offset:2px;border-radius:10px}
.wrap{max-width:680px;margin:0 auto;padding-block:8px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#F5F5F7}

/* ---------- Barre de navigation ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(245,245,247,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--hair)}
.nav-in{max-width:680px;margin:0 auto;height:52px;padding-block:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.navback{display:flex;align-items:center;gap:2px;color:#0071E3;font-size:17px;padding:6px 4px 6px 0;visibility:hidden}
.navback.on{visibility:visible}
.navback svg{width:12px;height:20px}
[dir="rtl"] .navback svg,[dir="rtl"] .chev{transform:scaleX(-1)}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:520px){.brand{display:none}}
.brand.on{opacity:1}
.langseg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.langseg button{font-size:13px;font-weight:600;padding:4px 11px;border-radius:7px;color:var(--muted);min-height:28px}
.langseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- Écrans ---------- */
.screen{display:none}
.screen.on{display:block;animation:enter .5s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;padding:0 24px;min-height:50px;border-radius:999px;font-weight:600;font-size:17px;transition:transform .15s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{background:var(--fill);color:#A1A1A6;cursor:not-allowed;transform:none}
.link{color:#0071E3;font-size:15px}

/* ---------- Accueil ---------- */
.home-hero{text-align:center;padding:36px 0 8px}
.orbit{display:flex;justify-content:center;gap:clamp(10px,4vw,22px);margin-bottom:34px}
.orbit .sym{width:clamp(52px,15vw,76px);animation:float 6s ease-in-out infinite}
.orbit .sym:nth-child(2){animation-delay:-1.5s}.orbit .sym:nth-child(3){animation-delay:-3s}.orbit .sym:nth-child(4){animation-delay:-4.5s}
.orbit svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 16px rgba(0,0,0,.10))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.home-hero h1{font-size:clamp(40px,11vw,64px);line-height:1.02;letter-spacing:-.04em;margin-bottom:16px}
html[lang="ar"] .home-hero h1{line-height:1.25}
.home-hero p{font-size:clamp(17px,4.6vw,21px);line-height:1.45;color:var(--muted);max-width:28em;margin:0 auto}
.choices{display:grid;gap:12px;margin:36px 0 0}
.choice{display:flex;align-items:center;gap:16px;width:100%;text-align:start;background:var(--card);border-radius:22px;padding:18px 18px;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s}
.choice:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 14px 34px rgba(0,0,0,.09)}
.choice:active{transform:scale(.985)}
.ico{flex:none;width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.choice .txt{flex:1;min-width:0}
.choice strong{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.choice small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.chev{flex:none;color:#C7C7CC;width:9px;height:16px}
.saved{margin-top:40px}
.saved h2{font-size:22px;margin:0 4px 12px}
.group{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.kid{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:13px 16px;position:relative}
.kid+.kid::before{content:"";position:absolute;top:0;inset-inline:66px 0;border-top:1px solid var(--hair)}
.kid svg{width:36px;height:36px;flex:none}
.kid .who{flex:1;min-width:0}
.kid strong{font-weight:600}
.kid .role{color:var(--muted);font-weight:400}
.kid small{display:block;color:var(--muted);font-size:14px}
.kid .del{color:#FF3B30;font-size:14px;padding:6px}
.quote-f{font-size:15px;color:var(--faint);text-align:center;margin:40px auto 0;max-width:30em}

/* ---------- Formulaire ---------- */
.page-h{padding:24px 0 6px}
.page-h h1{font-size:clamp(34px,9vw,48px);letter-spacing:-.035em}
.lead{color:var(--muted);font-size:18px;margin-top:10px;max-width:32em}
.form{background:var(--card);border-radius:22px;padding:22px;margin:26px 0 16px;box-shadow:var(--shadow)}
.form label{display:block;font-weight:600;font-size:15px;margin:0 0 8px}
.form input{width:100%;font:inherit;font-size:17px;padding:13px 16px;border:0;border-radius:12px;background:var(--bg);margin-bottom:22px;color:var(--ink)}
.form input:focus{outline:2px solid #0071E3;outline-offset:0}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:3px;margin-bottom:26px}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.note{font-size:14px;color:var(--muted);margin-top:16px;line-height:1.5}

/* ---------- Questionnaire ---------- */
.progress{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:25;margin:0 -20px;padding:0 20px 10px;background:rgba(245,245,247,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.progress .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--fill);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .5s var(--ease)}
#s-quiz.on{display:flex;flex-direction:column;min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px)}
#s-quiz .dock{margin-top:auto}
.q{padding-top:18px;padding-bottom:12px;animation:enter .4s var(--ease) both}
.q h2{font-size:clamp(28px,7.6vw,38px);letter-spacing:-.03em;line-height:1.12;margin-bottom:10px}
.hint{color:var(--muted);font-size:16px;margin-bottom:24px}
.poles{display:grid;gap:10px;margin-bottom:28px}
.pole{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);font-size:17px;line-height:1.4}
.pole b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.pole.pb b{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.scale{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border-radius:999px;padding:10px 14px;box-shadow:var(--shadow)}
.scale .end{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--ink);color:#fff}
.scale .end.eb{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dot{flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);transition:transform .2s var(--ease),background .2s,box-shadow .2s;display:grid;place-items:center}
.dot.s0,.dot.s4{width:44px;height:44px}.dot.s1,.dot.s3{width:36px;height:36px}.dot.s2{width:28px;height:28px}
.dot:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.dot[aria-pressed="true"]{background:var(--ink);box-shadow:none;transform:scale(1.08)}
.dot[aria-pressed="true"]::after{content:"";width:30%;height:30%;border-radius:50%;background:#fff}
.scale-lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 8px 0}
.ans{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:10px;font-size:17px;line-height:1.4;box-shadow:var(--shadow);transition:box-shadow .2s,transform .15s var(--ease)}
.ans:active{transform:scale(.985)}
.ans .t{flex:1}
.tick{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.tick svg{width:13px;height:13px;opacity:0;transition:opacity .2s}
.ans[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.ans[aria-pressed="true"] .tick{background:var(--ink);box-shadow:none}
.ans[aria-pressed="true"] .tick svg{opacity:1}
.ans.none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.ans.none[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.dock{position:sticky;bottom:0;z-index:20;margin:24px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:rgba(245,245,247,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);display:flex;gap:10px;align-items:center}
.dock .btn{flex:1;white-space:nowrap;font-size:16px;padding:0 18px}
.dock .btn.round{flex:none;width:50px;padding:0}
.dock .btn.round svg{width:11px;height:19px}
[dir="rtl"] .dock .btn.round svg{transform:scaleX(-1)}

/* ---------- Résultat ---------- */
.hero-card{position:relative;overflow:hidden;border-radius:30px;padding:36px 22px 22px;margin-top:14px;text-align:center;background:radial-gradient(130% 85% at 50% 0%,var(--soft) 0%,var(--soft) 30%,#fff 78%);box-shadow:var(--shadow)}
.hero-card .big{width:128px;height:128px;display:block;margin:0 auto 18px;filter:drop-shadow(0 16px 24px color-mix(in srgb,var(--c) 40%,transparent));animation:pop .8s var(--ease) both,float 6s 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hero-card h1{font-size:clamp(32px,8.6vw,46px);letter-spacing:-.035em;line-height:1.08}
.hero-card .sub{color:var(--muted);font-size:17px;max-width:30em;margin:10px auto 0}
.pair{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.pair svg{width:84px;height:84px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.12));animation:float 6s ease-in-out infinite}
.pair svg+svg{animation-delay:-3s}
.mix{margin-top:26px;text-align:start;display:grid;gap:12px}
.mix-row{display:grid;grid-template-columns:22px minmax(64px,auto) 1fr 44px;align-items:center;gap:12px;font-size:15px}
.mix-row svg{width:22px;height:22px}
.mix-row .track{height:6px;background:rgba(0,0,0,.06);border-radius:6px;overflow:hidden}
.mix-row .track i{display:block;height:100%;border-radius:6px;transition:width 1.1s var(--ease)}
.mix-row b{text-align:end;font-weight:600;font-variant-numeric:tabular-nums}
.mx-card{background:var(--card);border-radius:20px;margin-top:12px;box-shadow:var(--shadow)}
.mx-card summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;color:#0071E3}
.mx-card summary::-webkit-details-marker{display:none}
.mx-card summary::after{content:"+";font-size:22px;font-weight:400;line-height:1;transition:transform .25s var(--ease)}
.mx-card[open] summary::after{transform:rotate(45deg)}
.matrix{padding:0 14px 16px}
.matrix svg{width:100%;max-width:360px;display:block;margin:0 auto}
.matrix p{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.tabwrap{margin-top:22px}
.tabs{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:15;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:8px 20px;background:rgba(245,245,247,.94);border-bottom:1px solid var(--hair);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 15px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.panel{display:none;padding-top:8px}
.panel.on{display:block;animation:enter .35s var(--ease) both}
.panel>p,.panel .p{font-size:17px;line-height:1.55;margin:10px 2px}
.panel h3{font-size:24px;letter-spacing:-.025em;margin:32px 2px 12px}
.panel h3:first-child{margin-top:14px}
.panel ul{list-style:none;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel li{position:relative;padding:14px 18px 14px 40px;line-height:1.45}
[dir="rtl"] .panel li{padding:14px 40px 14px 18px}
.panel li::before{content:"";position:absolute;inset-inline-start:18px;top:22px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.panel li+li::after{content:"";position:absolute;top:0;inset-inline:40px 0;border-top:1px solid var(--hair)}
.trio3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.trio3>div{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);min-width:0}
.trio3 span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.trio3 strong{display:block;font-size:15px;line-height:1.3;font-weight:600}
.trio3 .fear{background:var(--soft);box-shadow:inset 0 0 0 2px var(--c)}
.rows{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.rows>div{padding:13px 18px;position:relative}
.rows>div+div::before{content:"";position:absolute;top:0;inset-inline:18px 0;border-top:1px solid var(--hair)}
.rows span{display:block;font-size:13px;color:var(--muted)}
.rows strong{font-weight:600;font-size:16px;line-height:1.4}
.box{border-radius:20px;padding:18px 20px;margin:14px 0;background:var(--soft)}
.box h4{font-size:17px;letter-spacing:-.015em;margin:14px 0 4px}
.box h4:first-child{margin-top:0}
.box ul{background:transparent;box-shadow:none;border-radius:0}
.box li{padding:6px 0 6px 20px}
[dir="rtl"] .box li{padding:6px 20px 6px 0}
.box li::before{inset-inline-start:2px;top:15px}
.box li+li::after{display:none}
.quote{background:var(--card);border-radius:18px;padding:16px 20px;margin:10px 0;font-size:18px;line-height:1.45;font-weight:500;box-shadow:var(--shadow);border-inline-start:4px solid}
.sit{background:var(--card);border-radius:20px;padding:18px 20px;margin:12px 0;box-shadow:var(--shadow)}
.sit h4{font-size:18px;margin-bottom:6px;letter-spacing:-.015em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.chips span{border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px}
.step{display:grid;grid-template-columns:36px 1fr;gap:14px;background:var(--card);border-radius:20px;padding:18px;margin:10px 0;box-shadow:var(--shadow)}
.step i{font-style:normal;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.step h4{font-size:18px;margin:6px 0 6px;letter-spacing:-.015em}
.step p{margin-top:6px;line-height:1.5}
.parents{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.parents button{background:var(--card);border-radius:18px;padding:14px;text-align:start;font-size:14px;line-height:1.35;box-shadow:var(--shadow);color:var(--muted);transition:box-shadow .2s}
.parents button strong{color:var(--ink);font-size:16px;display:block;margin-bottom:2px}
.parents button svg{width:30px;height:30px;display:block;margin-bottom:8px}
.parents button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.lab-small{font-size:13px;color:var(--muted);margin:22px 0 8px;text-align:center}
.hero-card .seg{max-width:360px;margin:0 auto}
.note{font-size:14px;color:var(--muted)}
.status{font-size:14px;color:var(--muted);flex-basis:100%}
.status:empty{display:none}
.dock.res{flex-wrap:wrap}
.disclaimer{font-size:13px;color:var(--faint);line-height:1.55;margin:36px 4px 0}
@media (max-width:380px){.trio3{grid-template-columns:1fr}.mix-row{grid-template-columns:20px 64px 1fr 40px}}
@media print{.nav,.tabs,.dock,.mx-card summary{display:none}.panel{display:block!important}}
</style>
</head>
<body>
<header class="nav" id="nav"><div class="nav-in">
  <button class="navback" id="navBack"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg><span id="navBackTxt"></span></button>
  <span class="brand" id="brand"></span>
  <div class="langseg" id="langbar" role="group" aria-label="Langue / اللغة / Language"><button data-l="fr" lang="fr" aria-label="Français">FR</button><button data-l="ar" lang="ar" aria-label="العربية">ع</button><button data-l="en" lang="en" aria-label="English">EN</button></div>
</div></header>
<div class="wrap">

<section class="screen on" id="s-home">
  <div class="home-hero">
    <div class="orbit" id="homeSymbols"></div>
    <h1 id="homeTitle"></h1>
    <p id="homeP1"></p>
  </div>
  <div class="choices">
    <button class="choice" data-go="child"><span class="ico" data-i="child"></span><span class="txt"><strong></strong><small></small></span><span data-chev></span></button>
    <button class="choice" data-go="adult"><span class="ico" data-i="adult"></span><span class="txt"><strong></strong><small></small></span><span data-chev></span></button>
    <button class="choice" data-go="couple"><span class="ico" data-i="couple"></span><span class="txt"><strong></strong><small></small></span><span data-chev></span></button>
  </div>
  <div class="saved" id="savedBox" hidden><h2 id="myFamily"></h2><div class="group" id="savedList"></div></div>
  <p class="quote-f" id="quoteHome"></p>
</section>

<section class="screen" id="s-form">

LIFE:[
 {t:"علامة سيئة أو فشل",d:{
  j:"{قد يقلّل من شأن العلامة أو يخفيها ليحفظ ماء وجهه. لا تُهينوه|قد تقلّل من شأن العلامة أو تخفيها لتحفظ ماء وجهها. لا تُهينوها}، خاصة أمام الإخوة. {ذكّروه|ذكّروها} بنجاح سابق، ثم اجعلوا العودة تحدّيًا ممتعًا.",
  v:"{يظن قبل كل شيء أنه خيّب ظنكم|تظن قبل كل شيء أنها خيّبت ظنكم}. طمئنوا أولًا: حبّكم لا يتوقف على علامة. بعد ذلك فقط، راجعوا معًا وأنتم {بجانبه|بجانبها}.",
  r:"{قد يغضب أو يتهم المعلّمة. دعوا الغضب يهدأ، ثم اطلبوا منه أن يحدّد بنفسه هدفه للمرة القادمة|قد تغضب أو تتهم المعلّمة. دعوا الغضب يهدأ، ثم اطلبوا منها أن تحدّد بنفسها هدفها للمرة القادمة}.",
  b:"{يحكم على نفسه بقسوة شديدة|تحكم على نفسها بقسوة شديدة}. حلّلوا الخطأ معًا كأنه تحقيق بوليسي، وقولوا بوضوح إن {قيمته|قيمتها} لا تُختزَل في نتيجة."}},
 {t:"تغيير: الانتقال إلى بيت جديد أو مدرسة جديدة",d:{
  j:"قدّموه كمغامرة: أصدقاء جدد وأماكن جديدة. حافظوا على طقس مرح لا يتغيّر، {وساعدوه على تقديم نفسه|وساعدوها على تقديم نفسها} للآخرين.",
  v:"غالبًا ما يكون هذا اللون الأكثر تأثرًا. أخبروا مبكرًا، وزوروا الأماكن مسبقًا، {واحتفظوا بأغراضه وطقوسه، وساعدوه|واحتفظوا بأغراضها وطقوسها، وساعدوها} على البقاء على تواصل مع الأصدقاء القدامى.",
  r:"{امنحوه قرارات يتخذها: اختيار مقعده، وتنظيم صناديقه، واختيار الطريق إلى المدرسة. التحكم يهدّئه|امنحوها قرارات تتخذها: اختيار مقعدها، وتنظيم صناديقها، واختيار الطريق إلى المدرسة. التحكم يهدّئها}.",
  b:"قدّموا أمورًا ملموسة: صور، ومخطط، وجدول زمني، ورزنامة حتى اليوم الموعود. أجيبوا عن كل {أسئلته|أسئلتها}، حتى المكرّرة منها."}},
 {t:"خلاف أو إقصاء من الأصدقاء",d:{
  j:"الرفض يمسّ {خوفه|خوفها} الأساسي. استمعوا دون تهوين («ليس أمرًا مهمًا»)، ثم {ساعدوه على إيجاد مجموعة أخرى أو نشاط يتألق فيه|ساعدوها على إيجاد مجموعة أخرى أو نشاط تتألق فيه}.",
  v:"{قد ينسحب أو يعتذر وهو لم يفعل شيئًا. ساعدوه على التعبير عمّا يشعر به ووضع حدود|قد تنسحب أو تعتذر وهي لم تفعل شيئًا. ساعدوها على التعبير عمّا تشعر به ووضع حدود}، بتمثيل الموقف معًا.",
  r:"{سيريد حسم الأمر بفرض نفسه. ساعدوه على وضع نفسه مكان الآخر، ثم على اقتراح حل بنفسه|ستريد حسم الأمر بفرض نفسها. ساعدوها على وضع نفسها مكان الأخرى، ثم على اقتراح حل بنفسها}.",
  b:"{يجترّ مسألة ما هو عادل. استمعوا إلى استدلاله حتى النهاية، ثم ساعدوه|تجترّ مسألة ما هو عادل. استمعوا إلى استدلالها حتى النهاية، ثم ساعدوها} على رؤية مشاعر الطرف الآخر أيضًا."}},
 {t:"اضطراب عائلي: ولادة، مرض، فقدان عزيز، توتر",d:{
  j:"{قد يُحدث ضجيجًا أو يرتكب حماقات ليلفت الانتباه. خصّصوا له|قد تُحدث ضجيجًا أو ترتكب حماقات لتلفت الانتباه. خصّصوا لها} لحظة اهتمام يومية، ولو قصيرة.",
  v:"{ينسحب كي لا يزعج أحدًا، ويمتصّ توتر الكبار. اسألوه بانتظام عن حاله، حتى لو أجاب «أنا بخير»|تنسحب كي لا تزعج أحدًا، وتمتصّ توتر الكبار. اسألوها بانتظام عن حالها، حتى لو أجابت «أنا بخير»}.",
  r:"{امنحوه دورًا مفيدًا يناسب سنّه (المساعدة مع الرضيع، تحضير الطعام). الفعل يساعده على تجاوز ما لا يتحكم فيه|امنحوها دورًا مفيدًا يناسب سنّها (المساعدة مع الرضيع، تحضير الطعام). الفعل يساعدها على تجاوز ما لا تتحكم فيه}.",
  b:"اشرحوا بكلمات صادقة وبسيطة تناسب {سنّه|سنّها}. الغموض {يُقلقه|يُقلقها} أكثر من الحقيقة."}}
],

const mem={};
async function getList(k){
  try{if(window.storage){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):[]}}catch(e){}
  try{const v=localStorage.getItem("cf_"+k);if(v)return JSON.parse(v)}catch(e){}
  return mem[k]||[];
}
async function setList(k,v){
  mem[k]=v;let ok=false;
  try{if(window.storage){await window.storage.set(k,JSON.stringify(v),false);ok=true}}catch(e){}
  try{localStorage.setItem("cf_"+k,JSON.stringify(v));ok=true}catch(e){}
  return ok;
}

/* ---------- Calcul : situations + position sur la matrice ---------- */
function finish(){
  const ITEMS=itemsFor(mode),sc={j:0,v:0,r:0,b:0};let n=0,x=0,y=0,nx=0,ny=0;
  ITEMS.forEach((it,i)=>{const a=answers[i];
    if(it.type==="sit"&&Array.isArray(a)){a.forEach(k=>sc[k]+=1/a.length);n++}
    if(it.type==="axe"&&typeof a==="number"){if(it.ax==="x"){x+=a;nx++}else{y+=a;ny++}}});
  x=nx?x/nx:0;y=ny?y/ny:0;
  const ax={j:(1+x)*(1+y)/4,r:(1+x)*(1-y)/4,v:(1-x)*(1+y)/4,b:(1-x)*(1-y)/4};
  const w=Math.min(n,8)/8*0.6,raw={},pct={};
  order.forEach(k=>raw[k]=w*(n?sc[k]/n:0)+(1-w)*ax[k]);
  order.forEach(k=>pct[k]=Math.round(raw[k]*100));
  pct[mainOf(raw)]+=100-order.reduce((t,k)=>t+pct[k],0);
  result={kind:mode,name:child.name,g:child.g,role:child.role,pct,date:new Date().toISOString()};
  loadFamily().then(()=>{renderResult(false);show("s-result")});
}

function matrixSVG(pts){
  const m=U().mx,hi=pts.map(p=>mainOf(p.pct)),ff="inherit";
  const q=(k,X,Y)=>`<rect x="${X}" y="${Y}" width="130" height="130" rx="14" fill="${COL[k]}" opacity="${hi.includes(k)?.22:.1}"/>`;
  const lab=(t,X,Y,a)=>`<text x="${X}" y="${Y}" text-anchor="${a||"middle"}" font-size="11" fill="#5B6676">${t}</text>`;
  const dots=pts.map((p,i)=>{const px=(p.pct.j+p.pct.r-p.pct.v-p.pct.b)/100,py=(p.pct.j+p.pct.v-p.pct.r-p.pct.b)/100;
    const cx=150-px*82+(pts.length>1?(i?6:-6):0),cy=150-py*82,ly=(i&&cy<200)||(!i&&cy<80)?cy+28:cy-17;
    return `<circle cx="${cx}" cy="${cy}" r="11" fill="${COL[mainOf(p.pct)]}" stroke="#fff" stroke-width="3"/><text x="${cx}" y="${ly}" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2B3C">${p.name}</text>`}).join("");
  return `<svg viewBox="0 0 300 310" role="img" aria-label="${m.aria}" style="direction:ltr;font-family:inherit">
   ${q("j",18,18)}${q("v",152,18)}${q("r",18,152)}${q("b",152,152)}
   <line x1="150" y1="12" x2="150" y2="288" stroke="#1E2B3C" stroke-width="1.5"/>
   <line x1="12" y1="150" x2="288" y2="150" stroke="#1E2B3C" stroke-width="1.5"/>
   <g font-family="${ff}" font-weight="700" font-size="14" fill="#1E2B3C">
    <text x="30" y="40">${NM("j")}</text><text x="270" y="40" text-anchor="end">${NM("v")}</text>
    <text x="30" y="272">${NM("r")}</text><text x="270" y="272" text-anchor="end">${NM("b")}</text></g>
   ${lab(m.emo,150,10)}${lab(m.rai,150,302)}${lab(m.fwd,16,145,"start")}${lab(m.bk,284,145,"end")}
   ${dots}</svg><p>${m.cap}</p>`;
}

    <div class="box" style="background:var(--${oc}-soft)"><h4>${u.keyYou}</h4><p>${g2(d.CLE[mc+oc])}</p></div>
    <h3>${g2(u.drives)}</h3>${trio3(a.obn,u.oTrio)}`;

    <h3>${g2(u.howRec)}</h3>${recoBox(a,oc,u.hisCarac)}`;

    <div class="box" style="background:var(--${oc}-soft)"><h4>${u.keyYou}</h4><p>${g2(d.CLE[mc+oc])}</p></div>`;
